  undici@>=7 <7.29.0: '>=7.29.0 <8'
  'undici@>=6 <6.28.0': '>=6.28.0 <7'
  tar@<7.5.21: '>=7.5.21 <8'
  flatted@<3.4.2: '>=3.4.2 <4'
  serialize-javascript@<7.0.3: '>=7.0.3 <8'
  '@remix-run/router@<1.23.2': '>=1.23.2 <2'
