  postcss@<8.5.18: '>=8.5.18 <9'
  smol-toml@<1.6.1: '>=1.6.1 <2'
  srvx@<0.11.13: '>=0.11.13 <0.12'
  svelte@<=5.55.6: '>=5.55.7 <6'
  'vite@>=6 <6.4.3': '>=6.4.3 <7'
  yaml: ^2.9.0
  express-rate-limit@<8.2.2: '>=8.2.2 <9'
  effect@<3.20.0: '>=3.20.0 <4'
  js-cookie@<3.0.7: '>=3.0.7 <4'
  qs@<6.15.2: '>=6.15.2 <7'
  'ws@>=8 <8.21.0': '>=8.21.0 <9'
  'ws@<7.5.11': '>=7.5.11 <8'
  uuid@<11.1.1: '>=11.1.1 <12'
  shell-quote@<=1.8.4: '>=1.9.0 <2'
  'form-data@<4.0.6': '>=4.0.6 <5'
  'js-yaml@<3.15.0': '>=3.15.0 <4'
  'js-yaml@>=4 <4.3.0': '>=4.3.0 <5'
  'seroval@<1.5.3': '>=1.5.3 <2'
  'valibot@<1.4.2': '>=1.4.2 <2'
  '@babel/core@<7.29.6': '>=7.29.6 <8'
  sharp: '>=0.35.3 <0.36'
  # better-sqlite3 12.10.0 added Node 26 support.
  'better-sqlite3@>=12 <12.10.0': '>=12.10.0 <13'

# Next's declarations import React from its virtual store location. Declaring
# the type peers keeps that resolution aligned with each consuming app instead
# of the workspace's unrelated optional React 18 fixture.
packageExtensions:
  # drizzle-kit has no drizzle-orm peer and must use the consuming workspace's version.
  drizzle-kit:
    peerDependencies:
      drizzle-orm: '*'
  # The new Kit migration API requires a modern libSQL client, not the legacy
  # 0.8 client used by the separate Kysely adapter fixture.
  'drizzle-kit@1.0.0-rc.3':
    dependencies:
      '@libsql/client': 0.17.4
  'next@>=16.2.11 <17':
    peerDependencies:
      '@types/react': '>=18.2.0'
      '@types/react-dom': '>=18.2.0'
  '@tanstack/react-query@>=5 <6':
    peerDependencies:
      '@types/react': '>=18.2.0'
  'cmdk@>=1 <2':
    peerDependencies:
      '@types/react': '>=18.2.0'
      '@types/react-dom': '>=18.2.0'
  'next-themes@>=0.4 <1':
    peerDependencies:
      '@types/react': '>=18.2.0'
      '@types/react-dom': '>=18.2.0'
  # The Zod resolver imports zod/v4 directly but does not declare Zod as a
  # peer, which breaks strict pnpm/Turbopack resolution in consuming apps.
  '@hookform/resolvers@>=5 <6':
    peerDependencies:
      zod: '>=3.25.0'
    peerDependenciesMeta:
      zod:
        optional: true

catalog:
  '@better-auth/utils': 0.5.0
  '@better-fetch/fetch': 1.3.1
  better-call: 1.4.0
  kysely: ^0.28.17 || ^0.29.0
  nanostores: ^1.3.0
  tsdown: 0.21.10
  typescript: ^6.0.3
  zod: ^4.5.4

catalogs:
  peer:
    kysely: ^0.28.5 || ^0.29.0
    nanostores: ^1.0.1
  react19:
    '@types/react': ^19.2.17
    '@types/react-dom': ^19.2.3
    react: ^19.2.7
    react-dom: ^19.2.7
  tailwind:
    '@tailwindcss/postcss': ^4.3.1
    tailwindcss: ^4.3.1
    tailwindcss-animate: ^1.0.7
  vitest:
    '@vitest/coverage-istanbul': ^4.1.10
    '@vitest/ui': ^4.1.10
    vitest: ^4.1.10

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tsparticles/engine': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  less: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  'unrs-resolver@1.12.2': true
  workerd: true
  electron: false
  electron-winstaller: false
  # AppKit's postinstall only checks package-version alignment; the two direct
  # AppKit dependencies are pinned together and verified by repository tests.
  '@reown/appkit': false
  # Optional native accelerators are unnecessary in the browser/Worker bundle.
  bufferutil: false
  keccak: false
  utf-8-validate: false

linkWorkspacePackages: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@cinaauth/*'
  - '@better-fetch/fetch'
  - 'better-call'

patchedDependencies:
  '@changesets/assemble-release-plan': patches/@changesets__assemble-release-plan.patch

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 43200

trustedDependencies:
  - esbuild
  - workerd

onlyBuiltDependencies:
  - esbuild
  - workerd
  - better-sqlite3
  - sharp
  - msw
  - electron
  - lefthook
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - "@parcel/watcher"
  - "@swc/core"
  - protobufjs
