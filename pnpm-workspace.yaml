  'devalue@>=5.6.3 <=5.8.0': 5.8.1
  esbuild@<0.28.1: '>=0.28.1 <0.29'
  fast-uri@<=3.1.3: '>=3.1.4 <4'
  fast-xml-builder@<=1.1.6: '>=1.1.7 <2'
