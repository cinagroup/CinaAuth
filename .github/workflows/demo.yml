name: Demo

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

permissions: {}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM || github.repository_owner }}

jobs:
  demo:
    name: demo (${{ matrix.demo }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.demo }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: expo
            directory: demo/expo
          - demo: nextjs
            directory: apps/account-portal
          - demo: electron
            directory: demo/electron
          - demo: oidc-client
            directory: apps/oidc-client-demo
          - demo: stateless
            directory: demo/stateless
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache turbo build setup
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: better-auth/shared-workflows/.github/actions/setup-pnpm@08e5520e7a829b03bee1152913682b67d2ba44b1

      - name: Build workspace packages
        run: pnpm build

      - name: Install demo dependencies
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile

      - name: Check Expo SDK compatibility
        if: matrix.demo == 'expo'
        working-directory: ${{ matrix.directory }}
        run: pnpm exec expo install --check

      - name: Typecheck Electron main and renderer
        if: matrix.demo == 'electron'
        working-directory: ${{ matrix.directory }}
        run: pnpm run typecheck
