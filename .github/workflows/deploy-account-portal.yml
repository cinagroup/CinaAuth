name: Deploy Account Portal

on:
  workflow_call:
    inputs:
      deployment_mode:
        description: Internal caller mode; the central production workflow must pass central
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operator_attestation:
        description: Type DEPLOY CINAAUTH ACCOUNT PORTAL PHASE ONE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: account-portal-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy accounts.cinaseek.ai
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/account-portal
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate reusable Account deployment mode
        if: inputs.deployment_mode != ''
        env:
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        run: |
          test "$DEPLOYMENT_MODE" = "central" || (echo "Reusable Account deployment mode must be central" && exit 1)

      - name: Validate manual Phase One authorization
        if: inputs.deployment_mode == ''
        env:
          CINAAUTH_PLANNED_WORKER_CONFIG: ../../workers/auth-api/wrangler.json
          OPERATOR_ATTESTATION: ${{ inputs.operator_attestation }}
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || (echo "Account Portal Phase One must run from main" && exit 1)
          test "$OPERATOR_ATTESTATION" = "DEPLOY CINAAUTH ACCOUNT PORTAL PHASE ONE" || (echo "Operator attestation does not authorize Account Portal Phase One" && exit 1)
          # JavaScript template literals must reach Node.js unchanged.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.CINAAUTH_PLANNED_WORKER_CONFIG, "utf8"));
            if (config.vars?.CINAAUTH_SIWE_ENABLED !== "false") {
              console.error("Account Portal Phase One requires the tracked SIWE switch to remain false");
              process.exit(1);
            }
            if (!/^[a-f0-9]{32}$/i.test(process.env.REOWN_PROJECT_ID ?? "")) {
              console.error("REOWN_PROJECT_ID must be exactly 32 hexadecimal characters");
              process.exit(1);
            }
          '

      - name: Configure wallet UI rollout from tracked Auth config
        env:
          CINAAUTH_PLANNED_WORKER_CONFIG: ../../workers/auth-api/wrangler.json
        run: |
          # JavaScript template literals must reach Node.js unchanged.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.CINAAUTH_PLANNED_WORKER_CONFIG, "utf8"));
            const enabled = config.vars?.CINAAUTH_SIWE_ENABLED;
            if (enabled !== "true" && enabled !== "false") {
              console.error("Tracked CINAAUTH_SIWE_ENABLED must be exactly true or false");
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SIWE_WALLET_UI_ENABLED=${enabled}\n`);
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Validate required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Validate central readiness credential
        if: inputs.deployment_mode == 'central'
        env:
          CINAAUTH_MIGRATION_TOKEN: ${{ secrets.CINAAUTH_MIGRATION_TOKEN }}
        run: |
          test "${#CINAAUTH_MIGRATION_TOKEN}" -ge 32 || (echo "CINAAUTH_MIGRATION_TOKEN must be at least 32 characters" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --dir ../.. build

      - name: Typecheck account portal
        run: pnpm run typecheck

      - name: Test account portal contracts
        run: >
          pnpm exec vitest run
          middleware.test.ts
          lib/auth-api.test.ts
          lib/auth-runtime-config.test.ts
          lib/auth-runtime-routes.test.ts
          lib/auth.test.ts
          lib/auth-capabilities.test.ts
          lib/auth-card-sign-in-contract.test.ts
          lib/auth-ui-phase1-contract.test.ts
          lib/auth-ui-phase2-contract.test.ts
          lib/sign-in-step-up-contract.test.ts
          lib/two-factor-navigation.test.ts
          lib/two-factor-recovery.test.ts
          lib/admin-access.test.ts
          lib/oidc-navigation.test.ts
          lib/reown-wallet-gate.test.ts
          lib/reown-wallet-cookie.test.ts
          lib/siwe-wallet-protocol.test.ts
          lib/reown-wallet-source-contract.test.ts
          lib/account-build-readiness.test.ts

      - name: Test Account Portal deployment target guard
        run: pnpm run test:deploy-cf

      - name: Test and check OAuth build parity
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          pnpm run test:oauth-build
          pnpm run check:oauth-build

      - name: Build for Cloudflare
        run: pnpm run build:cf
        env:
          CINAAUTH_URL: https://auth.cinaseek.ai
          NEXT_PUBLIC_CINAAUTH_API_URL: https://accounts.cinaseek.ai
          NEXT_PUBLIC_REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}

      - name: Wait for governed Auth readiness
        if: inputs.deployment_mode == 'central'
        env:
          CINAAUTH_MIGRATION_TOKEN: ${{ secrets.CINAAUTH_MIGRATION_TOKEN }}
        run: |
          ready_file="$RUNNER_TEMP/cinaauth-ready.json"
          for attempt in $(seq 1 30); do
            echo "Readiness check attempt $attempt"
            if curl --fail-with-body --show-error --silent \
              https://auth.cinaseek.ai/api/ready \
              -H "Authorization: Bearer $CINAAUTH_MIGRATION_TOKEN" \
              --output "$ready_file"; then
              if node -e '
                const fs = require("node:fs");
                const ready = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const required = [
                  "super-admin-governance-v1",
                  "provider-namespace-registry-v1",
                ];
                const installed = new Set(ready.database?.invariants?.installed ?? []);
                if (
                  ready.success !== true ||
                  ready.cutover?.state !== "live" ||
                  ready.database?.invariants?.ok !== true ||
                  required.some((id) => !installed.has(id))
                ) process.exit(1);
              ' "$ready_file"; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Auth Worker did not reach governed readiness" >&2
          exit 1

      - name: Verify live configurable authentication contract
        if: inputs.deployment_mode == 'central'
        env:
          CINAAUTH_CAPABILITIES_URL: https://accounts.cinaseek.ai/api/auth/capabilities
          CINAAUTH_EMAIL_AUTH_GATE: runtime-configurable
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: pnpm run check:oauth-build

      - name: Verify public Auth availability for Phase One
        if: inputs.deployment_mode == ''
        run: |
          headers_file="$RUNNER_TEMP/auth-capabilities.headers"
          capabilities_file="$RUNNER_TEMP/auth-capabilities.json"
          curl --fail-with-body --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --dump-header "$headers_file" \
            --output "$capabilities_file" \
            https://accounts.cinaseek.ai/api/auth/capabilities
          grep -Eiq '^cache-control:.*no-store' "$headers_file" || (echo "Auth capabilities must be no-store" && exit 1)
          # JavaScript template literals must reach Node.js unchanged.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const capabilities = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              capabilities.version !== 5 ||
              typeof capabilities.methods !== "object" ||
              capabilities.methods === null
            ) {
              console.error("Production Auth capabilities are unavailable or malformed");
              process.exit(1);
            }
          ' "$capabilities_file"

      - name: Deploy account portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:cf --deployment-target=production

      - name: Verify deployed Account wallet readiness parity
        env:
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          headers_file="$RUNNER_TEMP/account-build-readiness.headers"
          readiness_file="$RUNNER_TEMP/account-build-readiness.json"
          readiness_status="$(curl --show-error --silent \
            --retry 10 --retry-all-errors --retry-delay 6 \
            --dump-header "$headers_file" \
            --output "$readiness_file" \
            --write-out '%{http_code}' \
            https://accounts.cinaseek.ai/api/build-readiness)"
          grep -Eiq '^cache-control:.*no-store' "$headers_file" || (echo "Account build readiness must be no-store" && exit 1)
          # JavaScript template literals must reach Node.js unchanged.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const readiness = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const rawProjectId = process.env.REOWN_PROJECT_ID ?? "";
            if (rawProjectId !== "" && !/^[a-f0-9]{32}$/i.test(rawProjectId)) {
              console.error("Configured REOWN_PROJECT_ID has an invalid format");
              process.exit(1);
            }
            const expectedProjectId = rawProjectId === "" ? null : rawProjectId;
            const expectedReady = expectedProjectId !== null;
            const walletUiFlag = process.env.NEXT_PUBLIC_SIWE_WALLET_UI_ENABLED;
            if (walletUiFlag !== "true" && walletUiFlag !== "false") {
              console.error("Tracked wallet UI flag is invalid");
              process.exit(1);
            }
            const expectedWalletUiEnabled = walletUiFlag === "true";
            const expectedStatus = expectedReady ? 200 : 503;
            if (
              Number(process.argv[2]) !== expectedStatus ||
              readiness.schemaVersion !== 1 ||
              readiness.ready !== expectedReady ||
              readiness.siweProtocol !== "cinaauth-siwe-v2" ||
              readiness.walletUi !== "reown-appkit-v1" ||
              readiness.walletUiEnabled !== expectedWalletUiEnabled ||
              readiness.reownProjectId !== expectedProjectId
            ) {
              console.error("Deployed Account Portal wallet readiness does not match the tracked release");
              process.exit(1);
            }
          ' "$readiness_file" "$readiness_status"

      - name: Smoke test account portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body --show-error --silent --retry 10 --retry-all-errors --retry-delay 6 https://accounts.cinaseek.ai/
          curl --fail-with-body --show-error --silent --retry 10 --retry-all-errors --retry-delay 6 https://accounts.cinaseek.ai/api/auth/get-session

          domains_file="$RUNNER_TEMP/account-worker-domains.json"
          curl --fail-with-body --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$domains_file" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=demo-auth.cinagroup.com"
          # JavaScript template literals must reach Node.js unchanged.
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const response = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const domains = Array.isArray(response.result)
              ? response.result.filter((domain) => domain.hostname === "demo-auth.cinagroup.com")
              : [];
            if (response.success !== true || domains.length !== 1) {
              console.error("Legacy Account custom domain binding is missing or ambiguous");
              process.exit(1);
            }
            const [domain] = domains;
            if (
              domain.service !== "cinaauth-demo" ||
              domain.zone_name !== "cinagroup.com" ||
              (domain.environment !== undefined && domain.environment !== "production") ||
              typeof domain.cert_id !== "string" ||
              domain.cert_id.length === 0
            ) {
              console.error("Legacy Account custom domain binding does not match production");
              process.exit(1);
            }
          ' "$domains_file"

          legacy_headers="$RUNNER_TEMP/legacy-account.headers"
          legacy_body="$RUNNER_TEMP/legacy-account.body"
          legacy_status="$(curl --silent --show-error \
            --dump-header "$legacy_headers" \
            --output "$legacy_body" \
            --write-out '%{http_code}' \
            'https://demo-auth.cinagroup.com/sign-in?callbackURL=%2Fdashboard' || true)"
          if [ "$legacy_status" = "308" ]; then
            legacy_location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit }' "$legacy_headers")"
            test "$legacy_location" = "https://accounts.cinaseek.ai/sign-in?callbackURL=%2Fdashboard" || (echo "Legacy Account redirect target is invalid: $legacy_location" && exit 1)
          elif [ "$legacy_status" = "403" ] && (
            grep -Eiq '^cf-mitigated:[[:space:]]*challenge' "$legacy_headers" ||
            (grep -Eiq '^cf-ray:' "$legacy_headers" && grep -Eiq 'attention required|sorry, you have been blocked|cloudflare|ray id' "$legacy_body")
          ); then
            legacy_cf_ray="$(awk 'BEGIN { IGNORECASE=1 } /^cf-ray:/ { sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit }' "$legacy_headers")"
            echo "::warning::GitHub-hosted runner received a Cloudflare mitigation response for the legacy Account domain; the custom-domain binding and redirect middleware contract passed."
            {
              echo "### Legacy Account domain probe"
              echo "- GitHub-hosted runner received an identifiable Cloudflare mitigation response (HTTP 403)."
              echo "- Cloudflare Ray: ${legacy_cf_ray:-unavailable}"
              echo "- The Cloudflare custom-domain binding and redirect middleware contract passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected legacy Account domain response: $legacy_status" >&2
            exit 1
          fi
