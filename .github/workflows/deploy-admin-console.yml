name: Deploy Admin Console

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: admin-console-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy admin.cinaseek.ai
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/admin-console
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CINAAUTH_MIGRATION_TOKEN: ${{ secrets.CINAAUTH_MIGRATION_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test "${#CINAAUTH_MIGRATION_TOKEN}" -ge 32 || (echo "CINAAUTH_MIGRATION_TOKEN must be at least 32 characters" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production binding contract
        working-directory: workers/auth-api
        run: pnpm run check:production

      - name: Generate Cloudflare types
        run: pnpm run cf-typegen

      - name: Typecheck admin console
        run: pnpm run typecheck

      - name: Test admin console
        run: pnpm run test

      - name: Build for Cloudflare
        run: pnpm run build:cf

      - name: Wait for governed Auth readiness
        env:
          CINAAUTH_MIGRATION_TOKEN: ${{ secrets.CINAAUTH_MIGRATION_TOKEN }}
        run: |
          ready_file="$RUNNER_TEMP/cinaauth-ready.json"
          for attempt in $(seq 1 30); do
            echo "Readiness check attempt $attempt"
            if curl --fail-with-body --show-error --silent \
              https://auth.cinaseek.ai/api/ready \
              -H "Authorization: Bearer $CINAAUTH_MIGRATION_TOKEN" \
              --output "$ready_file"; then
              if node -e '
                const fs = require("node:fs");
                const ready = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const required = [
                  "super-admin-governance-v1",
                  "provider-namespace-registry-v1",
                ];
                const installed = new Set(ready.database?.invariants?.installed ?? []);
                if (
                  ready.success !== true ||
                  ready.cutover?.state !== "live" ||
                  ready.database?.invariants?.ok !== true ||
                  required.some((id) => !installed.has(id))
                ) process.exit(1);
              ' "$ready_file"; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Auth Worker did not reach governed readiness" >&2
          exit 1

      - name: Deploy admin console
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin-console
          command: deploy

      - name: Smoke test admin console
        run: curl --fail-with-body --show-error --silent --retry 10 --retry-all-errors --retry-delay 6 https://admin.cinaseek.ai/login
