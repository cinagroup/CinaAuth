name: Deploy OIDC Acceptance Client

on:
  push:
    branches: [main]
    paths:
      - apps/oidc-client-demo/**
      - packages/auth-web-contract/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-oidc-client-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oidc-client-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy oidc-demo.cinaseek.ai
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/oidc-client-demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate client
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Deploy acceptance client
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/oidc-client-demo
          command: deploy

      - name: Run production protocol acceptance
        env:
          CINAAUTH_OIDC_DEMO_TARGET_ORIGIN: https://oidc-demo.cinaseek.ai
        run: |
          for attempt in $(seq 1 40); do
            echo "Readiness check attempt $attempt"
            pnpm run check:production && exit 0
            sleep 15
          done
          exit 1
